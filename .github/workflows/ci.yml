name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# A new push to a branch cancels the run still going for the older commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Builds packages/shared first, then typechecks both apps against it.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches the monorepo Docker mistakes early — a workspace added without
      # its package.json being copied into the deps stage breaks only here.
      - name: Build images
        run: docker compose build
