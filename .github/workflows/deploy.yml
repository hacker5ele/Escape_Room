name: Deploy

# push only, never pull_request. The deploy role trusts exactly
# `ref:refs/heads/main` and `ref:refs/heads/dev`, so a pull request cannot
# assume it — but not offering the trigger at all is the belt to that braces,
# because this repository is public and anyone can open a pull request.
on:
  push:
    branches: [main, dev]

permissions:
  id-token: write # required to fetch the OIDC token
  contents: read

# Deploys queue rather than cancel: interrupting a half-finished App Runner
# rollout leaves the service in a state that needs manual attention.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Not a secret. An ARN is public information; the trust policy is what
  # protects it. Keeping it here means no repository secrets are needed, which
  # matters because nobody on the team has admin rights to create them.
  DEPLOY_ROLE_ARN: arn:aws:iam::445849136002:role/escape-room-deploy

jobs:
  deploy:
    name: Deploy and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment
        id: target
        # Through env rather than direct interpolation. This workflow only runs
        # on main and dev so a hostile ref name cannot reach here today, but the
        # habit is what stops the next `run:` block being the exploitable one.
        #
        # The Clerk publishable key is not a secret — it identifies the Clerk
        # instance and carries no authority, and Vite inlines it into the bundle
        # where anyone can read it anyway. It lives here rather than in a
        # repository variable because nobody on the team has admin to create
        # one. The SECRET key is a different matter entirely and lives in SSM.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_NAME" = "main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
            echo "clerk_key=pk_live_Y2xlcmsuY29vbC50ZiQ" >> "$GITHUB_OUTPUT"
          else
            echo "name=staging" >> "$GITHUB_OUTPUT"
            echo "clerk_key=pk_test_Z2VudWluZS1zbG90aC02My5jbGVyay5hY2NvdW50cy5kZXYk" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The same bundle serves every environment — the frontend calls the
      # relative path /api and has no environment-specific configuration.
      - name: Build frontend
        env:
          # Vite inlines this at build time, so it must be set here rather than
          # on the running container.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ steps.target.outputs.clerk_key }}
        run: |
          npm run build --workspace @escape-room/shared
          npm run build --workspace @escape-room/frontend

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Terraform publishes these; the workflow does not hardcode a generated
      # CloudFront id, and the deploy role never needs to read Terraform state
      # (which also contains the origin secret).
      - name: Look up environment resources
        id: infra
        env:
          TARGET: ${{ steps.target.outputs.name }}
        run: |
          # `set -o pipefail` and the explicit emptiness check are both load
          # bearing. Writing `echo "k=$(aws ...)"` swallows a failed lookup:
          # the command substitution yields an empty string, echo still exits 0,
          # and the step reports success with blank outputs. The deploy then
          # fails several steps later with an unhelpful message about an empty
          # ARN — which is exactly what happened on the first run.
          set -euo pipefail

          lookup() {
            local key="$1"
            local value
            value="$(aws ssm get-parameter --name "/escape-room/$TARGET/$key" \
              --query Parameter.Value --output text 2>/dev/null || true)"

            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "::error::Missing SSM parameter /escape-room/$TARGET/$key." \
                   "Has infra/live/$TARGET been applied with Terraform?"
              exit 1
            fi
            printf '%s' "$value"
          }

          {
            echo "bucket=$(lookup site_bucket)"
            echo "distribution=$(lookup distribution_id)"
            echo "service=$(lookup apprunner_service_arn)"
            echo "apprunner_url=$(lookup apprunner_url)"
            echo "url=$(lookup url)"
          } >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push the backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TARGET: ${{ steps.target.outputs.name }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/escape-room-backend"

          # Two tags: `sha-<commit>` so a deploy is traceable back to a commit,
          # and the moving environment tag App Runner is configured to pull.
          #
          # The `sha-` prefix is load bearing. The ECR lifecycle rule prunes
          # history by matching `sha-*`, which keeps the moving prod/staging
          # tags permanently exempt from expiry. A bare sha tag would fall
          # outside that pattern and go unpruned.
          docker build -f apps/backend/Dockerfile \
            -t "$IMAGE:sha-$GITHUB_SHA" \
            -t "$IMAGE:$TARGET" .
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:$TARGET"

      # Backend before frontend: a new API serving an old page is fine, the
      # reverse is not.
      - name: Deploy the backend and wait for it
        env:
          SERVICE: ${{ steps.infra.outputs.service }}
        run: |
          aws apprunner start-deployment --service-arn "$SERVICE" >/dev/null
          echo "Deployment started, waiting for the service to settle…"

          for _ in $(seq 1 60); do
            sleep 15
            STATUS=$(aws apprunner describe-service --service-arn "$SERVICE" \
              --query 'Service.Status' --output text)
            echo "  status: $STATUS"
            case "$STATUS" in
              RUNNING) echo "Service is running."; exit 0 ;;
              OPERATION_IN_PROGRESS) ;;
              *) echo "::error::App Runner ended in state $STATUS"; exit 1 ;;
            esac
          done

          echo "::error::Timed out waiting for App Runner to finish deploying"
          exit 1

      - name: Publish the frontend
        env:
          BUCKET: ${{ steps.infra.outputs.bucket }}
        run: |
          set -euo pipefail

          # Order matters. Upload the new hashed assets first, WITHOUT --delete:
          # the currently-live index.html still points at the old bundles, and
          # deleting them before the new index.html is in place would leave a
          # window where the site is serving a page whose scripts 404.
          aws s3 sync apps/frontend/dist "s3://$BUCKET" \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"

          # Now switch the entry point over. Vite's filenames are content
          # hashed, so these can be cached forever; index.html must never be,
          # or browsers keep loading bundles that no longer exist.
          aws s3 cp apps/frontend/dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache"

          # Only now is it safe to remove assets from previous deploys.
          aws s3 sync apps/frontend/dist "s3://$BUCKET" \
            --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"

      - name: Invalidate the CDN
        env:
          DISTRIBUTION: ${{ steps.infra.outputs.distribution }}
        run: |
          # Only the uncached entry point needs purging; everything else is
          # content-hashed and therefore a new path already.
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" \
            --paths "/" "/index.html" >/dev/null

      # The point of the whole pipeline: a deploy that serves a broken game is
      # a failed deploy. This plays the actual game against the live domain.
      - name: Smoke test the live site
        env:
          APPRUNNER_URL: ${{ steps.infra.outputs.apprunner_url }}
        run: npm run smoke -- "${{ steps.infra.outputs.url }}"

      - name: Summary
        if: always()
        run: |
          echo "### ${{ steps.target.outputs.name }} deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.infra.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
