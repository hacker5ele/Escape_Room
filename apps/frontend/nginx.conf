server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version to anyone probing the app.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API lives behind the same origin as the app, so the browser never
    # makes a cross-origin request and there is no CORS to misconfigure.
    # X-Forwarded-For is what lets the backend rate limiter see the real client
    # IP — the backend is started with TRUST_PROXY=1 to match.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite writes content-hashed filenames into /assets, so they can be cached
    # forever. index.html must never be cached, or a deploy ships stale HTML
    # pointing at bundles that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: a deep link like /room/room-02 is a client-side route, so
    # every unknown path has to return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
