# Whole stack: docker compose up --build
# The app is then on http://localhost:8080 — frontend and API on one origin.

services:
  backend:
    build:
      # Root context, because npm workspaces need the lockfile and
      # packages/shared, which live above apps/backend. See ADR-0009.
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      # development, not production: this is a local stack, and the local auth
      # mode below is refused outright when NODE_ENV is production.
      NODE_ENV: development
      PORT: 3000
      # No Clerk keys needed to run the stack. Type a username and you are in.
      AUTH_MODE: local
      # nginx is the single proxy hop in front of us, so trust exactly one.
      TRUST_PROXY: 1
      CORS_ORIGIN: http://localhost:8080
      ATTEMPT_RATE_LIMIT: 30
      # Unused while AUTH_MODE is local. Set both, and remove AUTH_MODE above,
      # if you want the compose stack to exercise the real Clerk path.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      # Deliberately unset: no table means the in-memory repository, so compose
      # stays a one-command experience with no AWS credentials. Progress does
      # not survive `docker compose down`.
      GAMES_TABLE_NAME: ''
    # Not published to the host: the browser reaches the API through nginx.
    expose:
      - '3000'
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Matches the backend: the compose stack signs in locally by default.
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-local}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
